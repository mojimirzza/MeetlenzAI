[project]
name = "meeting-question-intelligence"
version = "0.1.0"
description = "Local-first meeting question intelligence and human-moderated nomination platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "gradio>=6,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "orjson>=3.11,<4",
]

[project.optional-dependencies]
audio = [
  "faster-whisper>=1.2,<2",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
]
diarization = [
  "pyannote.audio>=4.0,<5",
]
agent = [
  "langgraph>=0.6,<1",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
all = [
  "meeting-question-intelligence[audio,diarization,agent,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"
